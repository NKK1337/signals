@if (tasks().length === 0) {
  <p class="empty">No {{ filter() }} tasks found.</p>
} @else {
  <ul>
    @for (task of tasks(); track task.id) {
      <li [class.done]="task.completed">
        <input type="checkbox" [checked]="task.completed" (change)="onComplete(task.id)" />
        <span class="title">{{ task.title }}</span>
        <button class="delete" (click)="onDelete(task.id)">Delete</button>
      </li>
    }
  </ul>
}
