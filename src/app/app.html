<div class="container">
  <h1>Task Management Dashboard</h1>

  <app-task-stats
    [total]="total()"
    [completed]="completedCount()"
    [active]="activeCount()"
    [percentage]="completionPercentage()"
  />

  <div class="add-row">
    <input #taskInput type="text" placeholder="New task..." (keyup.enter)="addTask(taskInput)" />
    <button (click)="addTask(taskInput)">Add</button>
  </div>

  <input class="search" type="text" placeholder="Search tasks..." (input)="onSearch($event)" />

  <div class="toolbar">
    <app-task-filter [current]="filter()" (filterChanged)="changeFilter($event)" />
    <button class="clear" (click)="clearAll()">Clear all</button>
  </div>

  <app-task-list
    [tasks]="filteredTasks()"
    [filter]="filter()"
    (taskCompleted)="toggleTask($event)"
    (taskDeleted)="deleteTask($event)"
  />
</div>
